name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -e apps/backend

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run quality gate
        run: python scripts/check_project.py

      - name: Validate production frontend container
        run: |
          docker build --file apps/frontend/Dockerfile.prod --tag knowledge-work-assistant-frontend:ci apps/frontend
          docker run --rm --add-host backend:127.0.0.1 \
            -e API_PREFIX=/api \
            -e AGENT_STREAM_MIN_TIMEOUT_SECONDS=30 \
            -e AGENT_STREAM_TIMEOUT_LLM_CALLS=4 \
            -e LLM_TIMEOUT_SECONDS=30 \
            -e MAX_UPLOAD_SIZE_MB=50 \
            -e NGINX_MAX_BODY_SIZE_MB=52 \
            -e NGINX_PROXY_TIMEOUT_SECONDS=300 \
            knowledge-work-assistant-frontend:ci nginx -t
          if docker run --rm --add-host backend:127.0.0.1 \
            -e API_PREFIX=/api \
            -e AGENT_STREAM_MIN_TIMEOUT_SECONDS=30 \
            -e AGENT_STREAM_TIMEOUT_LLM_CALLS=4 \
            -e LLM_TIMEOUT_SECONDS=30 \
            -e MAX_UPLOAD_SIZE_MB=50 \
            -e NGINX_MAX_BODY_SIZE_MB=50 \
            -e NGINX_PROXY_TIMEOUT_SECONDS=300 \
            knowledge-work-assistant-frontend:ci nginx -t; then
            echo "Expected the Nginx preflight to reject an unsafe body limit" >&2
            exit 1
          fi
