[project]
name = "agentic-rag-backend"
version = "0.1.0"
description = "Minimal FastAPI backend shell for the Agentic RAG platform."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "bcrypt>=4.2,<6.0",
  "celery>=5.4,<6.0",
  "fastapi>=0.115,<1.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "minio>=7.2,<8.0",
  "openai>=1.0,<3.0",
  "PyJWT>=2.10,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pypdf>=5.1,<7.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "redis>=5.2,<7.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
