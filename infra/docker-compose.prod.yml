services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD .* 0A ' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.prod
    env_file:
      - ${APP_ENV_FILE:-../.env}
    environment:
      APP_ENV: production
      AUTO_CREATE_TABLES: "false"
      PYTHONPATH: /app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-../.env}
    environment:
      APP_ENV: production
      AUTO_CREATE_TABLES: "false"
      PYTHONPATH: /app
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:8000' + os.getenv('API_PREFIX', '/api') + '/ready', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-../.env}
    environment:
      APP_ENV: production
      AUTO_CREATE_TABLES: "false"
      PYTHONPATH: /app
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--pool=solo"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --broker=$${REDIS_URL} inspect ping --destination celery@$${HOSTNAME} --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beat:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-../.env}
    environment:
      APP_ENV: production
      AUTO_CREATE_TABLES: "false"
      PYTHONPATH: /app
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    environment:
      API_PREFIX: ${API_PREFIX:-/api}
      AGENT_STREAM_MIN_TIMEOUT_SECONDS: ${AGENT_STREAM_MIN_TIMEOUT_SECONDS:-30}
      AGENT_STREAM_TIMEOUT_LLM_CALLS: ${AGENT_STREAM_TIMEOUT_LLM_CALLS:-4}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      NGINX_MAX_BODY_SIZE_MB: ${NGINX_MAX_BODY_SIZE_MB:-52}
      NGINX_PROXY_TIMEOUT_SECONDS: ${NGINX_PROXY_TIMEOUT_SECONDS:-300}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
